name: Deploy Frontend (Admin Console)

on:
  push:
    branches:
      - production
    paths:
      - 'manager/frontend/**'
      - 'deployment/vps/deploy_console_vi.py'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: manager/frontend/package-lock.json

      - name: Install dependencies & Build
        run: |
          cd manager/frontend
          npm ci
          npm run build
          tar -czf ../../xiaozhi-ui-vi.tgz -C dist .

      - name: Upload UI bundle to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "xiaozhi-ui-vi.tgz"
          target: "/tmp"

      - name: Upload deploy script to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deployment/vps/deploy_console_vi.py"
          target: "/opt/docker/antigravity/xiaozhi-go"
          strip_components: 2

      - name: Atomic Deploy & Nginx Reload
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/docker/antigravity/xiaozhi-go
            python3 deploy_console_vi.py
            rm -f /tmp/xiaozhi-ui-vi.tgz

      - name: Verify Web Admin Availability
        run: |
          echo "Verifying Admin Console at https://adminzeroone.hungnguyenaistem.online/ ..."
          status_code=$(curl -s -o /dev/null -w "%{http_code}" https://adminzeroone.hungnguyenaistem.online/)
          if [ "$status_code" -ne 200 ]; then
            echo "Failed with HTTP status: $status_code"
            exit 1
          fi
          echo "Admin Console is UP and Healthy (HTTP $status_code)!"
