name: Deploy Backend & Core Services

concurrency:
  group: xiaozhi-production-services
  cancel-in-progress: false

on:
  push:
    branches:
      - production
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'manager/backend/**'
      - 'pkg/**'
      - 'logger/**'
      - 'constants/**'
      - 'config/**'
      - 'deployment/vps/compose.yaml'
      - 'deployment/vps/Dockerfile'
      - 'deployment/vps/build_rnnoise.sh'
      - 'deployment/vps/otazeroone.nginx.conf'
      - 'deployment/vps/adminzeroone.nginx.conf'
      - 'docker/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      audio_preprocess:
        description: Experimental backend noise suppression (restart applies to new sessions)
        type: choice
        options: [unchanged, off, shadow, enforce]
        default: unchanged
      audio_diagnostics:
        description: Metadata-only audio diagnostic logging
        type: choice
        options: [unchanged, enabled, disabled]
        default: unchanged
      asr_input_gate:
        description: Auto-mode ASR input gate
        type: choice
        options: [unchanged, enabled, disabled]
        default: unchanged
      post_tts_guard_ms:
        description: Guard after first auto-resume packet (used when gate is enabled)
        type: choice
        options: ['0', '150', '300', '500', '1000']
        default: '300'
      audio_capture:
        description: Full mic and speaker packet recording (private VPS storage)
        type: choice
        options: [unchanged, enabled, disabled]
        default: unchanged


jobs:
  build-and-deploy-backend:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify asr_server submodule
        run: |
          if [ ! -f asr_server/server/setup.go ]; then
            echo "::error::asr_server submodule not checked out properly"
            exit 1
          fi

      - name: Build Linux Binary via Docker
        run: |
          docker build --target builder -f docker/Dockerfile.linux -t xiaozhi-build-linux .
          docker create --name xiaozhi_linux xiaozhi-build-linux
          mkdir -p dist_backend
          docker cp xiaozhi_linux:/out/linux-amd64/xiaozhi_server-linux-amd64/xiaozhi_server dist_backend/xiaozhi_server
          docker cp xiaozhi_linux:/out/audio_capture_export dist_backend/audio_capture_export
          docker cp xiaozhi_linux:/out/linux-amd64/xiaozhi_server-linux-amd64/ten-vad/lib/Linux/x64/libxiaozhi_rnnoise_v01.so dist_backend/
          docker cp xiaozhi_linux:/out/linux-amd64/xiaozhi_server-linux-amd64/ten-vad/lib/Linux/x64/libspeexdsp.so.1 dist_backend/
          docker cp xiaozhi_linux:/out/linux-amd64/xiaozhi_server-linux-amd64/ten-vad/lib/Linux/x64/RNNOISE-COPYING dist_backend/
          docker cp xiaozhi_linux:/out/linux-amd64/xiaozhi_server-linux-amd64/ten-vad/lib/Linux/x64/RNNOISE-REVISION dist_backend/
          docker cp xiaozhi_linux:/out/linux-amd64/xiaozhi_server-linux-amd64/ten-vad/lib/Linux/x64/SPEEXDSP-COPYRIGHT dist_backend/
          docker rm xiaozhi_linux
          chmod +x dist_backend/xiaozhi_server

      - name: Copy binary to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist_backend/xiaozhi_server,dist_backend/audio_capture_export,dist_backend/libxiaozhi_rnnoise_v01.so,dist_backend/libspeexdsp.so.1,dist_backend/RNNOISE-COPYING,dist_backend/RNNOISE-REVISION,dist_backend/SPEEXDSP-COPYRIGHT"
          target: "/tmp"
          strip_components: 1

      - name: Deploy and Reload Backend on VPS
        env:
          AUDIO_PREPROCESS: ${{ inputs.audio_preprocess || 'unchanged' }}
          AUDIO_DIAGNOSTICS: ${{ inputs.audio_diagnostics || 'unchanged' }}
          AUDIO_CAPTURE: ${{ inputs.audio_capture || 'unchanged' }}
          ASR_INPUT_GATE: ${{ inputs.asr_input_gate || 'unchanged' }}
          POST_TTS_GUARD_MS: ${{ inputs.post_tts_guard_ms || '300' }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: AUDIO_PREPROCESS,AUDIO_DIAGNOSTICS,AUDIO_CAPTURE,ASR_INPUT_GATE,POST_TTS_GUARD_MS
          script: |
            set -eu
            cd /opt/docker/antigravity/xiaozhi-go
            for artifact in xiaozhi_server audio_capture_export libxiaozhi_rnnoise_v01.so libspeexdsp.so.1 RNNOISE-COPYING RNNOISE-REVISION SPEEXDSP-COPYRIGHT; do
              test -s "/tmp/$artifact"
            done
            CONFIG_BACKUP=""
            if [ "$AUDIO_DIAGNOSTICS" != "unchanged" ] || [ "$AUDIO_CAPTURE" != "unchanged" ] || [ "$ASR_INPUT_GATE" != "unchanged" ] || [ "$AUDIO_PREPROCESS" != "unchanged" ]; then
              CONFIG_BACKUP="runtime/config/main_config.yaml.diagnostics-$(date -u +%Y%m%dT%H%M%SZ).bak"
              cp -p runtime/config/main_config.yaml "$CONFIG_BACKUP"
              chmod 600 "$CONFIG_BACKUP"
              python3 - <<'PYCONFIG'
            import os
            from pathlib import Path
            import yaml
            path = Path("runtime/config/main_config.yaml")
            config = yaml.safe_load(path.read_text())
            chat = config.setdefault("chat", {})
            if os.environ["AUDIO_DIAGNOSTICS"] != "unchanged":
                diagnostics = chat.setdefault("audio_diagnostics", {})
                diagnostics["enabled"] = os.environ["AUDIO_DIAGNOSTICS"] == "enabled"
                diagnostics.setdefault("interval_ms", 1000)
            if os.environ["AUDIO_CAPTURE"] != "unchanged":
                capture = chat.setdefault("audio_capture", {})
                capture["enabled"] = os.environ["AUDIO_CAPTURE"] == "enabled"
                capture.setdefault("directory", "/app/storage/audio-captures")
            if os.environ["ASR_INPUT_GATE"] != "unchanged":
                gate = chat.setdefault("asr_input_gate", {})
                gate["enabled"] = os.environ["ASR_INPUT_GATE"] == "enabled"
                if gate["enabled"]:
                    guard_ms = int(os.environ["POST_TTS_GUARD_MS"])
                    if not 0 <= guard_ms <= 1000:
                        raise ValueError("guard must be 0..1000 ms")
                    gate["post_tts_guard_ms"] = guard_ms
            mode = os.environ["AUDIO_PREPROCESS"]
            if mode not in {"unchanged", "off", "shadow", "enforce"}:
                raise ValueError("invalid audio preprocess mode")
            if mode != "unchanged":
                chat.setdefault("audio_preprocess", {})["mode"] = mode
            original_stat = path.stat()
            temporary = path.with_suffix(".diagnostics.tmp")
            temporary.write_text(yaml.safe_dump(config, allow_unicode=True, sort_keys=False))
            os.chown(temporary, original_stat.st_uid, original_stat.st_gid)
            temporary.chmod(original_stat.st_mode & 0o777)
            temporary.replace(path)
            print("Audio diagnostics:", os.environ["AUDIO_DIAGNOSTICS"], "capture:", os.environ["AUDIO_CAPTURE"], "asr_gate:", os.environ["ASR_INPUT_GATE"])
            PYCONFIG
            fi
            # Backup current working binary
            if [ -f bundle/xiaozhi_server ]; then
              cp bundle/xiaozhi_server bundle/xiaozhi_server.bak
            fi
            
            # Place new binary
            mv /tmp/xiaozhi_server bundle/xiaozhi_server
            chmod 755 bundle/xiaozhi_server
            mv /tmp/audio_capture_export bundle/audio_capture_export
            chmod 755 bundle/audio_capture_export
            
            # Versioned optional libraries: old binaries do not load them.
            mkdir -p bundle/ten-vad/lib/Linux/x64
            for name in libxiaozhi_rnnoise_v01.so libspeexdsp.so.1 RNNOISE-COPYING RNNOISE-REVISION SPEEXDSP-COPYRIGHT; do
              mv "/tmp/$name" "bundle/ten-vad/lib/Linux/x64/$name"
              chmod 644 "bundle/ten-vad/lib/Linux/x64/$name"
            done

            # Rebuild backend container image and restart backend service only
            docker compose build backend
            docker compose up -d --no-deps backend
            
            # Health check with automatic rollback
            echo "Waiting for backend health status..."
            HEALTHY=0
            for i in $(seq 1 12); do
              if curl -fsS http://127.0.0.1:8080/api/setup/status >/dev/null 2>&1; then
                HEALTHY=1
                echo "Backend is healthy and serving requests!"
                break
              fi
              echo "Checking backend health... attempt $i/12"
              sleep 3
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "Backend health check failed! Rolling back to previous binary..."
              if [ -f bundle/xiaozhi_server.bak ]; then
                cp bundle/xiaozhi_server.bak bundle/xiaozhi_server
                if [ -n "$CONFIG_BACKUP" ]; then
                  cp -p "$CONFIG_BACKUP" runtime/config/main_config.yaml
                fi
                docker compose build backend
                docker compose up -d --no-deps backend
              fi
              exit 1
            fi

            # Clean up backup on success
            rm -f bundle/xiaozhi_server.bak
