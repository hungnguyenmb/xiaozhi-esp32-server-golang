server {
    listen 80;
    listen [::]:80;
    server_name adminzeroone.hungnguyenaistem.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 308 https://adminzeroone.hungnguyenaistem.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name adminzeroone.hungnguyenaistem.online;

    ssl_certificate /etc/letsencrypt/live/adminzeroone.hungnguyenaistem.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adminzeroone.hungnguyenaistem.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:XiaozhiAdminTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 8m;

    location /xiaozhi/ { return 404; }

    # API liên lạc nội bộ chỉ được gọi qua mạng nội bộ.
    location ^~ /api/internal/ { return 404; }
    location = /api/configs { return 404; }
    location = /api/system/configs { return 404; }
    location = /admin/inject_msg { return 404; }

    # API và WebSocket giữ nguyên xác thực của Go Manager.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Giữ các chunk cũ cho trình duyệt đang mở khi cập nhật giao diện.
    location /assets/ {
        root /opt/docker/antigravity/xiaozhi-go/frontend/public;
        try_files $uri @embedded_assets;
        expires 7d;
    }

    location @embedded_assets {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    root /opt/docker/antigravity/xiaozhi-go/frontend/current;
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
