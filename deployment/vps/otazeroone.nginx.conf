server {
    listen 80;
    listen [::]:80;
    server_name otazeroone.hungnguyenaistem.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 308 https://otazeroone.hungnguyenaistem.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name otazeroone.hungnguyenaistem.online;

    ssl_certificate /etc/letsencrypt/live/otazeroone.hungnguyenaistem.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otazeroone.hungnguyenaistem.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:XiaozhiTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 8m;

    # Chỉ chuyển tiếp các đường dẫn đã được gateway giới hạn.
    location /xiaozhi/ {
        proxy_pass http://127.0.0.1:8989;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8989/health;
    }

    # API liên lạc nội bộ chỉ được gọi qua mạng nội bộ.
    location ^~ /api/internal/ { return 404; }
    location = /api/configs { return 404; }
    location = /api/system/configs { return 404; }
    location = /admin/inject_msg { return 404; }

    location = / {
        return 302 https://adminzeroone.hungnguyenaistem.online/;
    }
    location = /login {
        return 302 https://adminzeroone.hungnguyenaistem.online/login;
    }
    location / { return 404; }
}
